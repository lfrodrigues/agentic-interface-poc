[project]
name = "agentic-interface-poc"
version = "0.1.0"
description = "Agentic Interface Proof of Concept"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Lab49" }
]
dependencies = [
    "agno==1.4.5",
    "anthropic==0.49.0",
    "boto3==1.37.12",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "pydantic==2.10.6",
    "rich==13.9.4",
    "sqlalchemy==2.0.27",
    "pgvector==0.2.5",
    "psycopg[binary]==3.2.6",
    "openai>=1.0.0",
    "ruff==0.7.4",
    "langtrace-python-sdk==3.8.6",
    "dotenv==0.9.9",
    "Django>=5.1.7",
    "djangorestframework>=3.15.2",
    "Faker>=22.6.0",
    "groq>=0.24.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
